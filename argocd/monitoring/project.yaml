apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring
  namespace: argocd
spec:
  description: Monitoring and observability project

  sourceRepos:
    - https://github.com/iampratik11/k8s-gitops-platform.git
    - https://prometheus-community.github.io/helm-charts

  destinations:
    - namespace: monitoring
      server: https://kubernetes.default.svc

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
