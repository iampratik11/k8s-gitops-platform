replicaCount: 3

image:
  repository: user-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

config:
  NODE_ENV: production

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  cpu:
    targetUtilization: 50

serviceAccount:
  create: true
  name: user-service-sa
