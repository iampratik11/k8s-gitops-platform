apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: {{ include "user-service.fullname" . }}
  namespace: {{ .Release.Namespace }}

subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}

roleRef:
  kind: Role
  name: {{ include "user-service.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
