replicaCount: 3

image:
  repository: payment-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  NODE_ENV: development

secret:
  PAYMENT_API_KEY: "dev-payment-key"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  cpu:
    targetUtilization: 60

serviceAccount:
  create: true
  name: payment-service-sa
