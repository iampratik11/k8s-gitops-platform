replicaCount: 3

image:
  repository: 806997204926.dkr.ecr.us-east-2.amazonaws.com/payment-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

config:
  NODE_ENV: production

secret:
  PAYMENT_API_KEY: "prod-payment-key"

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  cpu:
    targetUtilization: 50

serviceAccount:
  create: true
  name: payment-service-sa
